<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOKYO HEARTBEAT // NEON-DRIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
<style>
:root {
    --neon-blue: #00f2ff;
    --neon-pink: #ff007b;
    --neon-purple: #bc13fe;
    --dark-bg: #09090b;
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Rajdhani', sans-serif; }
body, html { 
    margin: 0; padding: 0; 
    background: var(--dark-bg); 
    color: #e2e2e2; 
    overflow: hidden; 
    height: 100vh; width: 100vw; 
}

/* Day/Night Glow Logic */
.night-mode .window-glow { 
    background: var(--neon-blue) !important; 
    box-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
}

/* Authentication Screen */
#auth-screen { 
    position: fixed; inset: 0; 
    background: radial-gradient(circle at center, #1a1a2e 0%, #09090b 100%); 
    z-index: 20000; display: flex; align-items: center; justify-content: center; 
}
.login-box { 
    background: rgba(15, 15, 20, 0.9); 
    padding: 40px; border-radius: 10px; 
    border: 1px solid var(--neon-blue);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
    width: 90%; max-width: 400px; 
    text-align: center;
}
.login-input { 
    width: 100%; padding: 12px; 
    background: #000; border: 1px solid var(--border); 
    border-radius: 4px; margin: 10px 0; 
    color: var(--neon-blue); font-size: 16px; outline: none; 
}

/* HUD Styling */
#game-hud { 
    position: fixed; top: 15px; left: 15px; right: 15px; 
    height: 100px; display: flex; justify-content: space-between; 
    z-index: 1000; padding: 20px; 
    background: rgba(0, 0, 0, 0.7); 
    backdrop-filter: blur(15px);
    border: 1px solid var(--neon-pink);
    border-radius: 4px;
}

.bar-bg { width: 100%; height: 6px; background: #222; margin-top: 4px; overflow: hidden; }
#hp-fill { height: 100%; background: var(--neon-pink); width: 100%; transition: 0.5s; }
#xp-fill { height: 100%; background: var(--neon-blue); width: 0%; transition: 0.5s; }

/* Building Visuals */
.building { cursor: pointer; transition: 0.3s; margin-right: 60px; }
.structure { 
    width: 220px; border: 2px solid var(--border); 
    position: relative; background: #111;
}
.window-glow { 
    position: absolute; width: 20px; height: 20px; 
    background: #222; border-radius: 2px; 
}
.door { 
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 40px; height: 60px; background: #1a1a1a; border: 1px solid var(--neon-blue);
}

/* FB Style Profile */
.fb-style { background: #18191a; height: 100%; }
.fb-header { height: 150px; background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink)); }
.fb-avatar { 
    width: 80px; height: 80px; border-radius: 50%; 
    border: 4px solid #18191a; margin: -40px auto 10px; 
    background: #3a3b3c; display: flex; align-items: center; justify-content: center;
}

/* Inventory Items */
.inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
.inv-card { 
    background: #242526; padding: 15px; border-radius: 8px; 
    border: 1px solid var(--border); text-align: center;
}

.btn-cyber {
    background: none; border: 1px solid var(--neon-blue); color: var(--neon-blue);
    padding: 10px 20px; cursor: pointer; font-family: 'Orbitron'; text-transform: uppercase;
}
.btn-cyber:hover { background: var(--neon-blue); color: #000; }
</style>
</head>
<body>

<div id="auth-screen">
    <div class="login-box">
        <h1 style="font-family:'Orbitron'; color: var(--neon-blue);">NEO-TOKYO</h1>
        <input type="text" id="auth-user" class="login-input" placeholder="CITIZEN ID">
        <input type="password" id="auth-pass" class="login-input" placeholder="PASSCODE">
        <input type="email" id="auth-email" class="login-input" placeholder="EMAIL (SIGNUP ONLY)">
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn-cyber" style="flex:1" onclick="handleAuth('login')">LOGIN</button>
            <button class="btn-cyber" style="flex:1; border-color:var(--neon-pink); color:var(--neon-pink)" onclick="handleAuth('register')">SIGN UP</button>
        </div>
    </div>
</div>

<div id="game-hud" style="display:none;">
    <div style="width: 200px;">
        <div style="font-size:12px; color:var(--neon-pink)">VITALITY</div>
        <div class="bar-bg"><div id="hp-fill"></div></div>
        <div style="font-size:12px; color:var(--neon-blue); margin-top:10px;">DATA LEVEL: <span id="hud-lvl">1</span></div>
        <div class="bar-bg"><div id="xp-fill"></div></div>
    </div>
    <div style="text-align:right">
        <div style="font-family:'Orbitron'; color:var(--neon-blue); font-size:24px;">$<span id="res-val">0</span></div>
        <div style="font-size:10px; opacity:0.6">RESONANCE BALANCE</div>
    </div>
</div>

<div id="city-scroll" style="position:absolute; bottom:0; display:flex; padding: 50px; overflow-x:auto; width:100%;"></div>

<div id="modal-profile" class="full-modal" style="display:none; position:fixed; inset:0; z-index:10000; background: #18191a;">
    <div class="fb-style">
        <div class="fb-header"></div>
        <div class="fb-avatar">👤</div>
        <h2 id="prof-name" style="text-align:center">CITIZEN</h2>
        <div id="prof-stats" style="padding:20px;"></div>
        <button onclick="closeApp()" class="btn-cyber" style="margin:20px; width:calc(100% - 40px)">EXIT INTERFACE</button>
    </div>
</div>

<script>
let PLAYER = {};
const socket = io();

// FIXING THE 401 ERROR: Ensure the path is absolute and headers are correct
async function handleAuth(mode) {
    const username = document.getElementById('auth-user').value;
    const password = document.getElementById('auth-pass').value;
    const email = document.getElementById('auth-email').value;

    if(!username || !password) return alert("Credentials Required");

    try {
        const response = await fetch(`/${mode}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, email })
        });

        const data = await response.json();

        if (response.ok) {
            if (mode === 'register') {
                alert("Account Created. Please Login.");
            } else {
                PLAYER = data;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('game-hud').style.display = 'flex';
                initGame();
                socket.emit('join-game', PLAYER);
            }
        } else {
            alert(data.error || "Authentication Failed");
        }
    } catch (err) {
        console.error("Auth Error:", err);
        alert("Connection to Server Refused");
    }
}

function initGame() {
    renderCity();
    updateUI();
    // Start Day/Night Check
    setInterval(() => {
        const hour = new Date().getHours();
        const isNight = hour >= 18 || hour <= 6;
        document.body.classList.toggle('night-mode', isNight);
    }, 1000);
}

function renderCity() {
    const container = document.getElementById('city-scroll');
    const buildings = [
        { name: 'SAKURA APTS', color: '#111', windows: 12 },
        { name: 'HEART MALL', color: '#111', windows: 16 },
        { name: 'MOCHA CAFE', color: '#1a120b', windows: 4 }
    ];

    buildings.forEach(b => {
        const div = document.createElement('div');
        div.className = 'building';
        let winHtml = '';
        for(let i=0; i<b.windows; i++) {
            winHtml += `<div class="window-glow" style="top:${15 + (Math.floor(i/2)*40)}px; ${i%2==0?'left':'right'}:20px"></div>`;
        }
        div.innerHTML = `
            <div style="text-align:center; color:var(--neon-blue); margin-bottom:10px">${b.name}</div>
            <div class="structure" style="height:350px; background:${b.color}">
                ${winHtml}
                <div class="door"></div>
            </div>`;
        container.appendChild(div);
    });
}

function updateUI() {
    document.getElementById('res-val').innerText = PLAYER.res.toLocaleString();
    document.getElementById('hud-lvl').innerText = PLAYER.lvl;
    document.getElementById('hp-fill').style.width = PLAYER.hp + "%";
}

function closeApp() {
    document.querySelectorAll('.full-modal').forEach(m => m.style.display = 'none');
}
</script>
</body>
</html>
